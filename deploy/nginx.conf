# 聚合导航页 - Nginx 配置
# ============================================================
# 实际生效文件: /etc/nginx/conf.d/links.tbaosearch.asia.conf
# SSL 证书由 Certbot 自动管理 (标记 "# managed by Certbot" 的行请勿手动修改)
# 部署脚本不会自动覆盖此文件，避免破坏 Certbot 的 SSL 配置。
# 本文件仅作参考 / 首次部署时手动放置。
#
# 关键: 不要添加 location /admin/ 反代到其它服务 (如姬查查 5000)，
#       /admin* 由前端 SPA 的 try_files 兜底处理。
# ============================================================

server {
    server_name links.tbaosearch.asia;
    root /testpage/dist;
    index index.html index.htm;

    # 前端 SPA (history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代 (导航站后端, PM2 运行于 127.0.0.1:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/links.tbaosearch.asia/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/links.tbaosearch.asia/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name links.tbaosearch.asia;
    return 301 https://$host$request_uri;
}
